# 知选：docker compose up -d 后访问 http://localhost:${FRONTEND_PORT:-80}
# frontend（nginx）对外，app 只在内部网络；数据在命名卷 app-data 里。
services:
  frontend:
    image: nginx:1.27-alpine
    container_name: zhixuan-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      APP_HOST: app
      APP_PORT: 8080
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [zhixuan-network]
    restart: unless-stopped

  app:
    image: zhixuan-app:${ZHIXUAN_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: zhixuan-app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    env_file: [.env]
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_FILE: /data/app.db
      TRUST_PROXY: "1"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [zhixuan-network]
    restart: unless-stopped

volumes:
  app-data:

networks:
  zhixuan-network:
    driver: bridge
