# Local development only; generated defaults checked against Supabase CLI 2.116.0.
project_id = "zhixuan-ai-shopping-guide"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Local test target only. Cloud Postgres version remains unverified.
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# Local test accounts only; cloud confirmation policy is configured separately.
enable_confirmations = false
